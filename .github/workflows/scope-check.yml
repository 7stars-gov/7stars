name: Проверка зон ответственности

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  scope-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что автор меняет только свою зону
        uses: actions/github-script@v7
        env:
          ORG: "7stars-gov"
        with:
          github-token: ${{ secrets.ORG_TOKEN }}
          script: |
            const fs = require('fs');
            const scopes = JSON.parse(fs.readFileSync('.github/scopes.json', 'utf8'));
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const author = pr.user.login;
            const org = process.env.ORG;

            // Файлы PR
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            // Самое длинное совпадение ключа
            const keys = Object.keys(scopes).filter(k => !k.startsWith('_')).sort((a, b) => b.length - a.length);
            const zoneOf = (file) => {
              const k = keys.find(key => file === key || file.startsWith(key));
              return k ? { key: k, ...scopes[k] } : { key: '_по_умолчанию', ...scopes['_по_умолчанию'] };
            };

            // Членство в команде организации
            const memberCache = {};
            const isMember = async (team) => {
              if (team in memberCache) return memberCache[team];
              try {
                await github.rest.teams.getMembershipForUserInOrg({ org, team_slug: team, username: author });
                memberCache[team] = true;
              } catch (e) {
                memberCache[team] = false;
              }
              return memberCache[team];
            };

            const violations = [];
            for (const f of files) {
              const zone = zoneOf(f.filename);
              let allowed;
              if (zone.type === 'user') {
                allowed = author === zone.name;
              } else {
                allowed = await isMember(zone.name);
              }
              if (!allowed) {
                violations.push(`- \`${f.filename}\` — зона «${zone.key}» (${zone.type === 'team' ? 'команда ' + zone.name : 'владелец ' + zone.name})`);
              }
            }

            if (violations.length === 0) {
              core.info('Все изменения в своих зонах.');
              return;
            }

            const body = [
              `Проверка зон (ЗК26.11) не пройдена. Автор @${author} изменяет файлы вне своей зоны:`,
              ...violations,
              '',
              'Направьте межведомственный запрос (ЗК26.4) ответственному органу или измените PR так, чтобы он затрагивал только свою зону.',
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            core.setFailed('Изменения вне зоны автора (ЗК26.11).');
